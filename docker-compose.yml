services:
  nginx_ui:
    image: devops.laobullionbank.com/piti/nginx-ui:latest
    restart: unless-stopped
    ports:
      - "8080:8080"

    # Share the host's process namespace so systemctl can reach host's systemd
    pid: host
    privileged: true

    volumes:
      # Nginx config dirs (read-write for managing sites)
      - /etc/nginx:/etc/nginx

      # Nginx logs — read-write so nginx -t can open error.log during validation
      - /var/log/nginx:/var/log/nginx

      # Host systemd socket — needed for systemctl reload/status
      - /run/systemd:/run/systemd
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket

      # SSL certificates — mount at the same path as the host so nginx -t
      # can find certs at the exact paths referenced in config files
      - /home/lbb_admin/ssl:/home/lbb_admin/ssl

      # Persistent data dir for users.json
      - /home/lbb_admin/nginx_ui/data:/data

    environment:
      USE_SUDO: ${USE_SUDO:-true}
      SUDO_PASSWORD: ${SUDO_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-8}
      SSL_DIR: ${SSL_DIR:-/home/lbb_admin/ssl}
      DATA_DIR: ${DATA_DIR:-/data}
